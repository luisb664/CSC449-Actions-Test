name: Java CI Unit Tests (Simple)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Download JUnit 5 Runner
        run: wget https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.0/junit-platform-console-standalone-1.10.0.jar -O junit.jar
          
      - name: Compile Java Files
        run: javac -cp junit.jar -d . *.java
        
      - name: Run JUnit Tests
        run: java -jar junit.jar --class-path . --scan-class-path
